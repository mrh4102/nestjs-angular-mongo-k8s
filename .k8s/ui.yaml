---
apiVersion: v1
kind: Pod
metadata:
  name: diaryapp-ui-pod
  labels:
    name: diaryapp-ui-pod
spec:
  containers:
    - name: diaryapp-ui
      image: mrh4102/nestjs-angular-mongo-k8s-ui:latest
      volumeMounts:
        - name: angular-config
          mountPath: /usr/share/nginx/html/config.json
          subPath: config.json
          readOnly: true
  volumes:
    - name: angular-config
      configMap:
        name: angular-config
---
apiVersion: v1
kind: Service
metadata:
  name: diaryapp-ui-service
  labels:
    name: diaryapp-ui-service
spec:
  type: NodePort
  ports:
    - nodePort: 30082
      port: 80
      targetPort: 80
  selector:
    name: diaryapp-ui-pod
